services:
  saarthi-api:
    container_name: saarthi-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: adhirajpandey/saarthi:latest
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${SAARTHI_DATA_PATH:?set SAARTHI_DATA_PATH}:/app/data
      - ${SAARTHI_LOGS_PATH:?set SAARTHI_LOGS_PATH}:/app/logs
      - ${SAARTHI_WACLI_STORE_PATH:-./data/wacli}:/srv/appdata/wacli/store:ro

  saarthi-mcp:
    container_name: saarthi-mcp
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: adhirajpandey/saarthi:latest
    env_file:
      - .env
    restart: unless-stopped
    command: ["uv", "run", "python", "mcp-server/server.py"]
    environment:
      FASTMCP_HOME: /app/secrets/mcp
    ports:
      - "8001:8001"
    volumes:
      - ${SAARTHI_LOGS_PATH:?set SAARTHI_LOGS_PATH}:/app/logs
      - ${SAARTHI_GOOGLE_TASKS_TOKEN_PATH:?set SAARTHI_GOOGLE_TASKS_TOKEN_PATH}:/app/secrets/google/google-tasks-token.json:ro
      - ${SAARTHI_DATA_PATH:?set SAARTHI_DATA_PATH}/credentials/mcp:/app/secrets/mcp
      - ${SAARTHI_WACLI_STORE_PATH:-./data/wacli}:/srv/appdata/wacli/store:ro

  saarthi-cron:
    container_name: saarthi-cron
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
    image: adhirajpandey/saarthi:ops
    profiles: ["cron"]
    env_file:
      - .env
    environment:
      RCLONE_CONFIG: /app/secrets/rclone/rclone.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    volumes:
      - ${SAARTHI_DATA_PATH:?set SAARTHI_DATA_PATH}:/app/data
      - ${SAARTHI_LOGS_PATH:?set SAARTHI_LOGS_PATH}:/app/logs
      - ${SAARTHI_WACLI_STORE_PATH:-./data/wacli}:/srv/appdata/wacli/store:ro
      - ${SAARTHI_RCLONE_CONFIG_PATH:?set SAARTHI_RCLONE_CONFIG_PATH}:/app/secrets/rclone/rclone.conf:ro
      - ${SAARTHI_RCLONE_SERVICE_ACCOUNT_PATH:?set SAARTHI_RCLONE_SERVICE_ACCOUNT_PATH}:/app/secrets/rclone/gdrive-service-account.json:ro
